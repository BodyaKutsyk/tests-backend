x-infisical-env: &infisical-env
  INFISICAL_TOKEN: ${INFISICAL_TOKEN}
  INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
  INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
  INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET}
  INFISICAL_API_URL: http://host.docker.internal:80

x-infisical-hosts: &infisical-hosts
  - "host.docker.internal:host-gateway"

services:
  api:
    container_name: api_dev
    build:
      context: .
      target: dev
    image: api_dev
    environment:
      INFISICAL_ENV: dev
    depends_on:
      db_seed:
        condition: service_completed_successfully
        required: false

    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
        - action: rebuild
          path: package.json
        - action: sync+restart
          path: tsconfig.json
          target: /app/tsconfig.json
    ports: !override
      - "${API_INTERNAL_PORT}:${API_INTERNAL_PORT}"
  db_seed:
    image: api_dev
    container_name: db_seed
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pnpm infisical pnpm migration:run && pnpm infisical pnpm seed"
    extra_hosts: *infisical-hosts
    environment:
      <<: *infisical-env
      INFISICAL_ENV: dev
      POSTGRES_HOST: db

