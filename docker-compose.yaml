services:
  api:
    container_name: core_api_prod
    ports:
      - "${API_EXTERNAL_PORT}:${API_INTERNAL_PORT}"
    env_file:
      - .env
    build:
      context: .
      target: prod
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
  db:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_USER_PASSWORD}
    secrets:
      - db_password
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ${POSTGRES_DB} --quiet" ]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/init.sh:/docker-entrypoint-initdb.d/init.sh

secrets:
  db_password:
    file: ./secrets/db_password

volumes:
  postgres_data: