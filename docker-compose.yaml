x-infisical-env: &infisical-env
  INFISICAL_TOKEN: ${INFISICAL_TOKEN}
  INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
  INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
  INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET}
  INFISICAL_API_URL: http://host.docker.internal:80

x-infisical-hosts: &infisical-hosts
  - "host.docker.internal:host-gateway"

include:
  - docker-compose.pact.yml

services:
  api:
    image: api_image

    container_name: api_prod

    build:
      context: .
      target: prod

    environment:
      API_INTERNAL_PORT: ${API_INTERNAL_PORT}
      <<: *infisical-env
      POSTGRES_HOST: db
      INFISICAL_ENV: prod

    extra_hosts: *infisical-hosts

    ports:
      - "${API_EXTERNAL_PORT}:${API_INTERNAL_PORT}"

    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db_password
  db:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_ADMIN}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_USER_PASSWORD}
    secrets:
      - db_password
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ${POSTGRES_DB} --quiet" ]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/init.sh:/docker-entrypoint-initdb.d/init.sh

  pg_bouncer:
    image: edoburu/pgbouncer:v1.26.0-p0
    container_name: pg_bouncer
    ports:
      - "5433:5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./infrastructure/pgbouncer/pgbouncer.template.ini:/etc/pgbouncer/pgbouncer.template.ini:ro
    environment:
      POSTGRES_ADMIN: ${POSTGRES_ADMIN}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_USER_PASSWORD}
      AUTH_TYPE: scram-sha-256
    entrypoint:
      - /bin/sh
      - -ec
      - |
        sed \
          -e "s|[$]{POSTGRES_DB}|$${POSTGRES_DB}|g" \
          -e "s|[$]{POSTGRES_ADMIN}|$${POSTGRES_ADMIN}|g" \
          /etc/pgbouncer/pgbouncer.template.ini \
          > /etc/pgbouncer/pgbouncer.ini
    
        printf '"%s" "%s"\n' \
          "$${POSTGRES_ADMIN}" \
          "$${POSTGRES_ADMIN_PASSWORD}" \
          > /etc/pgbouncer/userlist.txt
    
        chmod 600 /etc/pgbouncer/userlist.txt
    
        exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $$DB_USER -d $$POSTGRES_DB" ]
      interval: 2s
      timeout: 3s
      retries: 10
  backup:
    image: postgres:17-alpine
    container_name: pg_backup
    depends_on:
      - db
    environment:
      POSTGRES_ADMIN: ${POSTGRES_ADMIN}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "find /backups/.last_success -mmin -1560 -print -quit | grep -q ."
        ]
      interval: 5m
      timeout: 5s
      retries: 3
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ./scripts/backup.cron:/etc/crontabs/backup:ro
    command: ["crond", "-f", "-l", "2"]
  restore-drill:
    image: postgres:17
    container_name: pg_restore-drill
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    tmpfs:
      - /var/lib/postgresql/data
    profiles:
      - restore
    volumes:
      - ./backups:/backups:ro

secrets:
  db_password:
    file: ./secrets/db_password

volumes:
  postgres_data:
  restore_drill_data:
