x-infisical-env: &infisical-env
  INFISICAL_TOKEN: ${INFISICAL_TOKEN}
  INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
  INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
  INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET}
  INFISICAL_API_URL: http://host.docker.internal:80

x-infisical-hosts: &infisical-hosts
  - "host.docker.internal:host-gateway"

#include:
#  - docker-compose.pact.yml

services:
  api:
    image: api_image
    container_name: api_prod
    build:
      context: .
      target: prod
    environment:
      API_PORT: ${API_PORT}
      <<: *infisical-env
      POSTGRES_HOST: pg_bouncer
      RABBITMQ_HOST: rabbitmq
      REDIS_CACHE_HOST: redis-cache
      REDIS_QUEUE_HOST: redis-queue
      DOCLING_HOST: docling
      OLLAMA_HOST: ollama
      INFISICAL_ENV: prod
      CDN_HOST: cdn
    extra_hosts: *infisical-hosts
    ports:
      - "${API_PORT}:${API_PORT}"
    command:
      - run
      - --projectId=${INFISICAL_PROJECT_ID}
      - --env=prod
      - --domain=http://host.docker.internal:80
      - --
      - /nodejs/bin/node
      - /app/dist/main.js

    depends_on:
      pg_bouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    secrets:
      - db_password
  db:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_USER_PASSWORD}
    secrets:
      - db_password
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN} -d ${POSTGRES_DB} --quiet" ]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/init.sh:/docker-entrypoint-initdb.d/init.sh

  pg_bouncer:
    image: edoburu/pgbouncer:v1.26.0-p0
    container_name: pg_bouncer
    ports:
      - "5433:5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./infrastructure/pgbouncer/pgbouncer.template.ini:/etc/pgbouncer/pgbouncer.template.ini:ro
    environment:
      POSTGRES_ADMIN: ${POSTGRES_ADMIN}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_USER_PASSWORD}
      AUTH_TYPE: scram-sha-256
    entrypoint:
      - /bin/sh
      - -ec
      - |
        sed \
          -e "s|[$]{POSTGRES_DB}|$${POSTGRES_DB}|g" \
          -e "s|[$]{POSTGRES_ADMIN}|$${POSTGRES_ADMIN}|g" \
          /etc/pgbouncer/pgbouncer.template.ini \
          > /etc/pgbouncer/pgbouncer.ini
    
        printf '"%s" "%s"\n' \
          "$${POSTGRES_ADMIN}" \
          "$${POSTGRES_ADMIN_PASSWORD}" \
          > /etc/pgbouncer/userlist.txt
    
        chmod 600 /etc/pgbouncer/userlist.txt
    
        exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $$DB_USER -d $$POSTGRES_DB" ]
      interval: 2s
      timeout: 3s
      retries: 10
  backup:
    image: postgres:17-alpine
    container_name: pg_backup
    depends_on:
      - db
    environment:
      POSTGRES_ADMIN: ${POSTGRES_ADMIN}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      start_period: 24h
      test:
        [
          "CMD-SHELL",
          "find /backups/.last_success -mmin -1560 -print -quit | grep -q ."
        ]
      interval: 5m
      timeout: 5s
      retries: 3
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ./scripts/backup.cron:/etc/crontabs/backup:ro
      - ./scripts/backup.cron:/etc/crontabs/root:ro
    command: ["crond", "-f", "-l", "2"]
  restore-drill:
    image: postgres:17
    container_name: pg_restore-drill
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    tmpfs:
      - /var/lib/postgresql/data
    profiles:
      - restore
    volumes:
      - ./backups:/backups:ro
  rabbitmq:
    image: rabbitmq:4.2.9-management
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
  redis-cache:
    image: redis:7.2-alpine
    container_name: redis-cache
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --port ${REDIS_CACHE_PORT}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_CACHE_PORT}:${REDIS_CACHE_PORT}"
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: [
        "CMD-SHELL",
        "REDISCLI_AUTH='${REDIS_PASSWORD}' redis-cli -p ${REDIS_CACHE_PORT} ping | grep -q PONG"
      ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s


  redis-queue:
    image: redis:7.2-alpine
    container_name: redis-queue
    restart: always
    ports:
      - "${REDIS_QUEUE_PORT}:${REDIS_QUEUE_PORT}"
    volumes:
      - redis-queue-data:/data
    command:
      - "redis-server"
      - "--port"
      - "${REDIS_QUEUE_PORT}"
      - "--maxmemory-policy"
      - "noeviction"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
    healthcheck:
      test: [
        "CMD-SHELL",
        "REDISCLI_AUTH='${REDIS_PASSWORD}' redis-cli -p ${REDIS_QUEUE_PORT} ping | grep -q PONG"
      ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  api-rate-a:
    profiles: ["rate-limit-demo"]
    build:
      context: .
      target: prod
    environment:
      <<: *infisical-env
      POSTGRES_HOST: pg_bouncer
      RABBITMQ_HOST: rabbitmq
      REDIS_CACHE_HOST: redis-cache
      REDIS_QUEUE_HOST: redis-queue
      DOCLING_HOST: docling
      OLLAMA_HOST: ollama
      CDN_HOST: cdn
      INFISICAL_ENV: dev
    command: ["sh", "-c", "exec infisical run --projectId=\"$$INFISICAL_PROJECT_ID\" --env=dev -- pnpm start:prod"]
    extra_hosts: *infisical-hosts
    depends_on:
      pg_bouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    secrets:
      - db_password
    ports:
      - "3001:${API_PORT}"
    healthcheck:
      test: [ "NONE" ]

  api-rate-b:
    profiles: ["rate-limit-demo"]
    build:
      context: .
      target: prod
    environment:
      <<: *infisical-env
      POSTGRES_HOST: pg_bouncer
      RABBITMQ_HOST: rabbitmq
      REDIS_CACHE_HOST: redis-cache
      REDIS_QUEUE_HOST: redis-queue
      INFISICAL_ENV: prod
    extra_hosts: *infisical-hosts
    depends_on:
      pg_bouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    secrets:
      - db_password
    ports:
      - "3002:5137"
    healthcheck:
      test: ["NONE"]
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.38.2
    restart: unless-stopped
    ports:
      - "${DOCLING_PORT}:${DOCLING_PORT}"
    environment:
      DOCLING_SERVE_ENG_KIND: local
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      OMP_NUM_THREADS: "4"
      DOCLING_SERVE_API_KEY: ${DOCLING_API_KEY:?API key is required}

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:${OLLAMA_PORT}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: "5m"
    ports:
      - "${OLLAMA_PORT}:${OLLAMA_PORT}"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:${OLLAMA_PORT}
      OLLAMA_MODEL: ${OLLAMA_MODEL:?OLLAMA_MODEL is required}
    command: ["pull", "${OLLAMA_MODEL}"]
    restart: "no"
  cdn:
    image: ghcr.io/nginx/nginx-s3-gateway/nginx-oss-s3-gateway:latest
    ports:
      - "${CDN_PORT}:80"
    environment:
      S3_BUCKET_NAME: ${STORAGE_BUCKET}
      S3_REGION: ${AWS_REGION}
      S3_SERVER: s3.${AWS_REGION}.amazonaws.com
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
      AWS_SIGS_VERSION: "4"
      ALLOW_DIRECTORY_LIST: "false"
      PROVIDE_INDEX_PAGE: "false"
      S3_SERVER_PROTO: https
      S3_SERVER_PORT: "443"
      S3_STYLE: virtual
    volumes:
      - ./infrastructure/cdn/default.conf.template:/etc/nginx/templates/default.conf.template:ro

secrets:
  db_password:
    file: ./secrets/db_password

volumes:
  postgres_data:
  restore_drill_data:
  rabbitmq-lib:
  rabbitmq-log:
  redis-queue-data:
  redis-cache-data:
  ollama_data:
